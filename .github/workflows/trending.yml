name: GitHub Trending Daily

on:
  schedule:
    - cron: '0 0 * * *'        # 每天 08:00（北京时间）
  workflow_dispatch:            # 支持手动触发

jobs:
  update-trending:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pyquery

      - name: Run scraper
        run: python scraper.py

      - name: Commit & push
        run: |
          git config user.name "aaaa0051213-oss"
          git config user.email "aaaa0051213-oss@users.noreply.github.com"
          git add .
          git commit -m "Update trending $(date +%F)" || echo "no changes"
          git push
